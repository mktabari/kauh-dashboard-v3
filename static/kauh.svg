<!-- <svg xmlns="http://w3.org" viewBox="30 30 450 350" width="100%" height="100%"> -->
<svg version="1.1" id="Layer_1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" x="0px" y="0px"
	 width="100%" viewBox="30 30 450 350" enable-background="new 0 0 1024 1024" xml:space="preserve">
  <!-- Definitions for reusable elements and styles -->
  <defs>
    <style>
      .bg-dark-blue { fill: #0B192C; }
      .brand-orange { fill: #FF6500; }
      .brand-blue { fill: #1E3E62; }
      .light-orange { fill: #FF8A3D; }
      .text-bold { font-family: 'Montserrat', 'Arial Black', sans-serif; font-weight: 900; }
    </style>
  </defs>

  <!-- Central Server Dashboard Icon / Shield Base -->
  <g id="Dashboard-Icon">
    <!-- Outer Server Rack Frame -->
    <rect x="96" y="40" width="320" height="320" rx="28" class="brand-blue" />
    <rect x="108" y="52" width="296" height="296" rx="18" class="bg-dark-blue" />

    <!-- Top Server Blade -->
    <g id="Server-Blade-1">
      <rect x="128" y="76" width="256" height="52" rx="8" class="brand-blue" />
      <!-- Status Lights -->
      <circle cx="160" cy="102" r="10" class="brand-orange" />
      <circle cx="190" cy="102" r="10" class="light-orange" />
      <!-- Performance Bars (Dashboard Metric) -->
      <rect x="224" y="94" width="40" height="16" rx="4" class="brand-orange" />
      <rect x="272" y="94" width="70" height="16" rx="4" class="bg-dark-blue" />
      <rect x="350" y="94" width="16" height="16" rx="4" class="brand-orange" />
    </g>

    <!-- Middle Server Blade (Active/Alert State) -->
    <g id="Server-Blade-2">
      <rect x="128" y="148" width="256" height="52" rx="8" class="brand-orange" />
      <!-- Status Lights -->
      <circle cx="160" cy="174" r="10" class="bg-dark-blue" />
      <circle cx="190" cy="174" r="10" class="bg-dark-blue" />
      <!-- Line Chart Overlay (Dashboard Metric) -->
      <path d="M 224 192 L 250 172 L 280 188 L 310 164 L 340 180 L 366 160" fill="none" stroke="#0B192C" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Bottom Server Blade -->
    <g id="Server-Blade-3">
      <rect x="128" y="220" width="256" height="52" rx="8" class="brand-blue" />
      <!-- Status Lights -->
      <circle cx="160" cy="246" r="10" class="brand-orange" />
      <circle cx="190" cy="246" r="10" class="brand-blue" />
      <!-- Connection Nodes -->
      <circle cx="240" cy="246" r="8" class="brand-orange" />
      <line x1="248" y1="246" x2="288" y2="246" stroke="#FF6500" stroke-width="6" />
      <circle cx="296" cy="246" r="8" class="brand-orange" />
      <line x1="304" y1="246" x2="344" y2="246" stroke="#FF6500" stroke-width="6" />
      <circle cx="352" cy="246" r="8" class="light-orange" />
    </g>

    <!-- Dashboard Network Connection Accents -->
    <path d="M 80 200 L 48 200 L 48 320 L 96 320" fill="none" stroke="#FF6500" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 432 200 L 464 200 L 464 320 L 416 320" fill="none" stroke="#1E3E62" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Typography Section -->
  <g id="Company-Name">
    <!-- Text Background Plate for High Contrast -->
    <rect x="65" y="280" width="384" height="92" rx="16" class="brand-orange" />
    
    <!-- "KAUH" Text Layer -->
    <text x="256" y="350" font-size="64" letter-spacing="6" text-anchor="middle" class="text-bold class= bg-dark-blue" fill="#0B192C">KAUH</text>
  </g>
</svg>
